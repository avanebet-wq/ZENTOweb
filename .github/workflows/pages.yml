name: Deploy site to GitHub Pages

on:
  push:
    branches: [ccr-ff9c64e0-210wz2]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare only public site files
        run: |
          mkdir -p site
          cp index.html styles.css app.js boot.js admin.html auth.js captcha.js captcha.css site/
          mkdir -p site/assets
          cp -r assets/logo.png assets/captcha site/assets/
          mkdir -p site/data
          cp data/products.json site/data/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
